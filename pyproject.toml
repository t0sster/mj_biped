[project]
name = "mj-biped"
version = "0.1.0"
description = "BE2R bipedal robot tasks in mjlab"
readme = "README.md"
authors = [
    { name = "Kirill", email = "kirotavr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mjlab>=1.4.0",
    "mujoco>=3.8.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.9",
]

[project.scripts]
mj-biped = "mj_biped:main"
mj-biped-export-policy = "mj_biped.controller.policy_exporter:main"
optim-play = "optim.scripts.play:main"
optim-plot = "optim.scripts.plot_metrics:main"

[project.entry-points."mjlab.tasks"]
mj-biped = "mj_biped.tasks:biped_2d"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",
    "B",
    "UP",
]
ignore = ["F403"]
